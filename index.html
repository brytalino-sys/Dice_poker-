<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#100a07">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кости">
<meta name="format-detection" content="telephone=no">
<title>Покер на костях</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="fonts.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="fonts.css"></noscript>
<style>
  #splash {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-content: center; justify-items: center; gap: 18px;
    background: radial-gradient(ellipse at 50% 40%, #2a1a10, #100a07 70%);
    color: #ebe0c7; font-family: Georgia, 'Times New Roman', serif; text-align: center;
    transition: opacity 0.4s ease;
  }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash .die { width: 64px; height: 64px; animation: sp-roll 1.6s ease-in-out infinite; }
  #splash .t { font-size: 34px; line-height: 1.05; letter-spacing: 0.02em; }
  #splash .s { font-style: italic; font-size: 15px; color: rgba(236, 231, 218, 0.6); }
  @keyframes sp-roll { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg) translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { #splash .die { animation: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="ui"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="splash" aria-hidden="true">
  <svg class="die" viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="11" fill="#ebe0c7" stroke="#786040" stroke-width="2"/><g fill="#2b1d14"><circle cx="20" cy="20" r="5"/><circle cx="44" cy="20" r="5"/><circle cx="32" cy="32" r="5"/><circle cx="20" cy="44" r="5"/><circle cx="44" cy="44" r="5"/></g></svg>
  <div class="t">Покер<br>на костях</div>
  <div class="s">Раскладываем кости…</div>
</div>
<noscript><p style="position:fixed;inset:auto 0 30px;text-align:center;color:#ebe0c7;z-index:101">Для игры нужен JavaScript.</p></noscript>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
